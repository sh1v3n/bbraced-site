name: AI health check

# Every morning, ask the live site to test each AI provider/model.
# If a key, credit balance or model name needs fixing, this run fails
# and GitHub emails you. Needs repo secrets SITE_URL and HEALTH_CHECK_TOKEN.

on:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check AI providers
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
        run: |
          status=$(curl -sS -o result.json -w "%{http_code}" --max-time 90 \
            -H "Authorization: Bearer $HEALTH_CHECK_TOKEN" "$SITE_URL/api/health")
          cat result.json
          echo
          test "$status" = "200"
